function validateEvents(events){

 const map=new Map();for(const e of events){const t=e?.snapshot;if(!safeId(e?.id)||!safeId(e.taskId)||!safeId(e.visitId)||!Array.isArray(e.parents)||e.parents.some(p=>!safeId(p))||!t||t.id!==e.taskId||!safeId(t.originVisitId)||!normCode(t.centerCode)||taskErrors(t).length||!Array.isArray(t.photoIds)||t.photoIds.some(p=>!safeId(p))||!Number.isFinite(Date.parse(e.at)))throw new Error(i18n('Se encontró una versión de tarea inválida.'));if(map.has(e.id)&&JSON.stringify(map.get(e.id))!==JSON.stringify(e))throw new Error(i18n('Un mismo ID de actualización contiene datos distintos.'));map.set(e.id,e);}

function bindEvents(){document.addEventListener('click',event=>{const target=event.target.closest('[data-act]');if(!target)return;event.preventDefault();if(busy){notify(i18n('Esperá a que termine la operación actual.'));return;}const action=target.dataset.act;const long=['finalize-visit','start-plan','open-history','pdf','pdf-confirmed','excel-visit','export-followup','snapshot','resolve-import','new-visit','save-task','scan','camera'].includes(action);if(long){busy=true;target.disabled=true;}Promise.resolve(handleAction(target)).catch(e=>{console.error(e);notify(e.message||i18n('No se pudo completar la operación.'));}).finally(()=>{if(long){busy=false;if(target.isConnected)target.disabled=false;}});});
 const update=e=>{const el=e.target,path=el.dataset?.bind;if(!path||!validBind(path)||finalized(state.visit))return;if(path==='visit.centerCode'&&state.visit.centerLocked)return;let value=el.type==='checkbox'?el.checked:el.value;if(el.dataset.upper){value=value.toUpperCase();const start=el.selectionStart,end=el.selectionEnd;el.value=value;try{el.setSelectionRange(start,end);}catch{}}if(['visit.auditor','visit.auditorId'].includes(path)&&get(state,path)!==value)state.visit.signatureAuditor=null;set(state,path,value);dirty();if(e.type==='change'&&path.startsWith('visit.extras'))render();};document.addEventListener('input',update);document.addEventListener('change',update);
 document.addEventListener('change',async e=>{try{if(e.target.id==='saved-center'){const center=state.centers.find(c=>c.code===e.target.value);if(center&&!state.visit.centerLocked){Object.assign(state.visit,{centerCode:center.code,centerName:center.name,manager:center.manager});dirty();render();}}if(['gallery','capture'].includes(e.target.id)){const files=[...e.target.files];e.target.value='';await uploadPhotos(files,photoContext);}if(e.target.id==='import-followup'){const files=[...e.target.files];e.target.value='';await importFollowup(files);}if(e.target.id==='restore-backup'){const file=e.target.files[0];e.target.value='';if(file)await restoreBackup(file);}}catch(error){console.error(error);notify(error.message||i18n('No se pudo cargar el archivo.'));}});

EXCEL_TEMPLATE.rowPattern=/<x:row\b[^>]*\br="2"[^>]*>[\s\S]*?<\/x:row>/;

// One visit, one row. Spanish headers and categories are stable across UI languages.
function spanishLineSummary(v){return selectedLines(v).map(code=>PRODUCTS.find(p=>p[0]===code)?.[1]||code).join(', ');}
function spanishPointTitle(q){const key=q.id.slice(2);return COMMON_V2.find(r=>r[0]===key)?.[2]||HOME_V2.find(r=>r[0]===key)?.[2]||SPEC_V2.find(r=>r[0]===key)?.[3]||q.title;}
function excelVisitRow(s){const v=s.visit,tasks=selectedTasks(s),changed=new Set(s.events.filter(e=>e.visitId===v.id&&e.snapshot.centerCode===normCode(v.centerCode)).map(e=>e.taskId));const touched=tasks.filter(t=>changed.has(t.id));const findings=[],refs=new Map();for(const q of checksFor(v)){const answer=v.checks[q.id];if(answer?.status!=='fail')continue;const ref='H'+(findings.length+1);findings.push(ref+' ['+q.id+'] '+spanishPointTitle(q)+'\n'+answer.note);refs.set(q.id,ref);for(const task of tasks)if(samePoint(task.sourceKey,q.id))refs.set(task.id,ref);}
 for(const task of tasks.filter(t=>t.originVisitId===v.id)){if(refs.has(task.id))continue;const ref='H'+(findings.length+1);findings.push(ref+' [T-'+task.id.slice(0,8)+'] '+task.title);refs.set(task.id,ref);}
 const taskRef=t=>refs.get(t.id)||'T-'+t.id.slice(0,8);
 const actionText=t=>taskRef(t)+': '+t.action+' ['+ES_TASK_STATUS[t.status]+']';
 const previous=touched.filter(t=>t.originVisitId!==v.id).map(t=>'T-'+t.id.slice(0,8)+': '+t.title+' | '+ES_TASK_STATUS[t.status]+(t.note?' | '+t.note:'')+(t.verification?' | Verificación: '+t.verification:''));
 const extras=[v.extras.ride&&v.type!=='ride'?ES_TYPES.ride.label:'',v.extras.support&&v.type!=='support'?ES_TYPES.support.label:'',v.extras.training&&v.type!=='training'?ES_TYPES.training.label:''].filter(Boolean).join(' | ');
 const parts=v.date.split('-').map(Number),serial=(Date.UTC(parts[0],parts[1]-1,parts[2])-Date.UTC(1899,11,30))/86400000;
 return [serial,normCode(v.centerCode),v.centerName,v.auditor,v.auditorId,ES_TYPES[v.type].label,extras,spanishLineSummary(v)+(v.extras.ride&&v.type!=='ride'?' | Domicilio: '+(PRODUCTS.find(p=>p[0]===v.homeLine)?.[1]||v.homeLine):''),v.objective,findings.join('\n\n'),findings.length,previous.join('\n\n'),touched.map(actionText).join('\n'),touched.map(t=>taskRef(t)+': '+t.owner).join('\n'),touched.map(t=>taskRef(t)+': '+dateLabel(t.due)).join('\n'),tasks.filter(t=>t.status!=='closed').length,tasks.filter(t=>overdue(t,v.date)).length,touched.filter(t=>t.status==='closed').length,v.conclusion,s.media.filter(m=>m.visitId===v.id).length,v.order,v.model,v.serial,v.id];
}
function xmlValue(value){return String(value??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,' ').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');}
const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(bytes){let crc=0xffffffff;for(const b of bytes)crc=crcTable[(crc^b)&255]^(crc>>>8);return (crc^0xffffffff)>>>0;}
function zipStored(entries){const encoder=new TextEncoder(),files=[],directory=[];let offset=0;for(const entry of entries){const name=encoder.encode(entry.name),data=entry.data,crc=crc32(data);const local=new Uint8Array(30+name.length),lv=new DataView(local.buffer);lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x800,true);lv.setUint16(8,0,true);lv.setUint16(12,33,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,name.length,true);local.set(name,30);files.push(local,data);
 const central=new Uint8Array(46+name.length),cv=new DataView(central.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint16(10,0,true);cv.setUint16(14,33,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);central.set(name,46);directory.push(central);offset+=local.length+data.length;}
 const centralSize=directory.reduce((n,a)=>n+a.length,0),end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(8,entries.length,true);ev.setUint16(10,entries.length,true);ev.setUint32(12,centralSize,true);ev.setUint32(16,offset,true);return new Blob([...files,...directory,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});}
function visitWorkbookBlob(row){if(row.length!==EXCEL_TEMPLATE.headers.length)throw new Error(i18n('La fila de la visita no coincide con la estructura del Excel.'));for(const value of row)if(typeof value==='string'&&value.length>32767)throw new Error(i18n('Un texto supera el límite de una celda de Excel. Conservá el PDF y el JSON y reducí ese texto antes de exportar.'));
 const numberCols=new Set([0,10,15,16,17,19]),cellTag=EXCEL_TEMPLATE.prefix+'c',p=EXCEL_TEMPLATE.prefix;
 const cells=row.map((value,i)=>{const col=String.fromCharCode(65+i),style=EXCEL_TEMPLATE.styles[i];return numberCols.has(i)?`<${cellTag} r="${col}2" s="${style}" t="n"><${p}v>${Number(value)}</${p}v></${cellTag}>`:`<${cellTag} r="${col}2" s="${style}" t="inlineStr"><${p}is><${p}t xml:space="preserve">${xmlValue(value)}</${p}t></${p}is></${cellTag}>`;}).join('');
 const maxLines=Math.max(...row.map((v,i)=>String(v??'').split('\n').reduce((n,line)=>n+Math.max(1,Math.ceil(line.length/Math.max(12,EXCEL_TEMPLATE.widths[i]*.82))),0)));
 const height=Math.min(390,Math.max(50,maxLines*16+12));const replacement=`<${p}row r="2" ht="${height}" customHeight="1">${cells}</${p}row>`;
 const encoder=new TextEncoder(),decoder=new TextDecoder();const entries=EXCEL_TEMPLATE.entries.map(entry=>{let data=Uint8Array.from(atob(entry.base64),c=>c.charCodeAt(0));if(entry.name===EXCEL_TEMPLATE.sheet){const xml=decoder.decode(data);if(!EXCEL_TEMPLATE.rowPattern.test(xml))throw new Error(i18n('No se encontró la fila de datos en la plantilla Excel.'));data=encoder.encode(xml.replace(EXCEL_TEMPLATE.rowPattern,()=>replacement));}return{name:entry.name,data};});return zipStored(entries);}
async function exportVisitExcel(){const errors=visitErrors(state);if(errors.length)throw new Error(errors[0]);while(pendingPhotos.size)await Promise.all([...pendingPhotos]);const row=excelVisitRow(state),blob=visitWorkbookBlob(row);download('Visita_'+baseName()+'.xlsx',blob,blob.type);archiveVisit(state);dirty(0);notify(i18n('Excel descargado: encabezados y una fila para esta visita.'));
}

// Plans use their stable ID as the visit ID; Excel retains its existing 24 columns.
function validateAgenda(f){const notices=validateAcknowledgements(f);if(f?.schema!=='field-tech-agenda'||f.version!==1||typeof f.auditorId!=='string'||!Array.isArray(f.plans)||f.plans.length>1000||!Array.isArray(f.followups))throw Error(i18n('Usá una agenda JSON exportada por el panel de supervisión.'));for(const p of f.plans){if(!safeId(p.id)||!isDate(p.date)||!Object.hasOwn(TYPES,p.type)||!normCode(p.centerCode)||['centerName','manager','auditor','auditorId','objective'].some(k=>typeof p[k]!=='string')||p.auditorId!==f.auditorId||!Number.isInteger(p.revision)||p.revision<1||!['scheduled','cancelled'].includes(p.status)||!Array.isArray(p.lines)||p.lines.some(l=>!PRODUCTS.some(x=>x[0]===l)))throw Error(i18n('La agenda contiene una visita incompatible.'));}if(new Set(f.plans.map(p=>p.id)).size!==f.plans.length)throw Error(i18n('La agenda contiene visitas duplicadas.'));for(const followup of f.followups){const scratch=freshState();mergeFollowups(scratch,[followup]);}for(const p of f.plans)if(p.status!=='cancelled'&&!notices.some(n=>n.planId===p.id&&['received','cancelled','reassigned'].includes(n.status))&&!f.followups.some(f=>normCode(f.center.code)===normCode(p.centerCode)))throw Error(i18n('Falta el seguimiento de un centro de la agenda.'));return f;}
async function importAgenda(files){if(!files[0])return;const f=validateAgenda(await readJSON(files[0]));const next=clone(state);next.agenda??=[];for(const p of f.plans){const old=next.agenda.find(x=>x.plan.id===p.id);if(old&&(old.plan.revision>p.revision||old.plan.revision===p.revision&&Date.parse(old.receivedAt)>Date.parse(f.exportedAt)))continue;if(old&&old.plan.revision===p.revision&&JSON.stringify(old.plan)!==JSON.stringify(p))throw Error(i18n('Una visita de agenda tiene dos versiones diferentes. Pedí al supervisor una agenda actualizada.'));const item={notice:old?.notice&&old.notice.planRevision>=p.revision?old.notice:null,plan:clone(p),followup:clone(f.followups.find(x=>normCode(x.center.code)===normCode(p.centerCode))||null),receivedAt:f.exportedAt};if(old)next.agenda[next.agenda.indexOf(old)]=item;else next.agenda.push(item);}applyAcknowledgements(next,f);state=next;dirty(0);agendaView();notify(i18n('Agenda importada. Seleccioná la visita que vas a realizar.'));}

async function startPlannedVisit(planId){const item=state.agenda?.find(i=>i.plan.id===planId);if(item&&(item.plan.status==='cancelled'||['cancelled','reassigned'].includes(item.notice?.status)))throw Error(i18n('La visita ya no está disponible en la agenda.'));if(item&&archivedAgenda(item)){if(agendaVisit(item))await openHistoryVisit(planId);else agendaView();return;}if(!item||item.plan.status==='cancelled')throw Error(i18n('La visita ya no está disponible en la agenda.'));if(state.editTask)throw Error(i18n('Guardá o descartá la tarea en edición primero.'));if(state.visit.id===planId){state.entryScreen=false;closeModal();render();dirty();return;}if(hasDraft()&&!confirm(i18n('¿Abrir la visita de agenda? El borrador actual se conservará en el historial. Descargá antes su PDF y seguimiento si necesitás entregarlos.')))return;while(pendingPhotos.size)await Promise.all([...pendingPhotos]);const next=clone(state);if(next.visit.centerCode)archiveVisit(next);const p=item.plan,existing=next.visits.find(v=>v.id===p.id);const lines=p.lines||[];next.visit=existing?clone(existing):{...freshVisit(),id:p.id,planId:p.id,planRevision:p.revision,plannedDate:p.date,centerCode:normCode(p.centerCode),centerName:p.centerName,manager:p.manager,auditor:p.auditor,auditorId:p.auditorId,type:p.type,objective:p.objective,lines:clone(lines),line:lines[0]||''};next.visit.workflowVersion??=1;next.entryScreen=false;next.tab=0;next.scan=null;let candidate=item.followup?mergeFollowups(next,[item.followup]):{events:next.events,media:next.media,visits:next.visits,centers:next.centers,center:{code:p.centerCode,name:p.centerName,manager:p.manager},conflicts:[]};candidate.base=next;candidate.exports=[item.receivedAt].filter(Boolean);mergeCandidate=candidate;importNames=[i18n('Mi agenda')];if(candidate.conflicts.length){showModal(modalHead(i18n('Revisar cambios simultáneos'))+html`<div class="stack"><p>Elegí la versión vigente antes de comenzar. Se conservan todas las alternativas.</p>${candidate.conflict function finalized(v){return !!v.completion;}
function agendaVisit(item){return state.visit.id===item.plan.id?state.visit:state.visits.find(v=>v.id===item.plan.id);}
function receivedNotice(item,v){return item.notice?.status==='received'&&((v?.completion&&item.notice.resultId===v.completion.id)||(!v?.workflowVersion&&!v?.completion));}
function archivedAgenda(item){const v=agendaVisit(item);return item.plan.status==='cancelled'||['cancelled','reassigned'].includes(item.notice?.status)||finalized(v||{})||receivedNotice(item,v);}
function lifecycleBanner(){if(!finalized(state.visit))return '';return html`<div class="notice"><b>Visita finalizada.</b> ${esc(visitReceiptLabel(state.visit))}<p>Los datos quedan protegidos. Para corregirlos, reabrí la visita y enviá un nuevo resultado.</p><div class="actions"><button type="button" data-act="export-followup">Descargar resultado (.json)</button><button type="button" class="quiet" data-act="reopen-visit">Reabrir para corregir</button><button type="button" class="quiet" data-act="agenda">Mi agenda / historial</button></div></div>`;}
function visitReceiptLabel(v){const item=state.agenda?.find(i=>i.plan.id===v.id);return item&&receivedNotice(item,v)?i18n('Resultado recibido por supervisión'):i18n('Resultado pendiente de compartir o confirmar');}
function protectFinalizedUI(){if(!finalized(state.visit)||state.entryScreen)return;const allowed=new Set(['tab','prev','next','pdf','pdf-confirmed','excel-visit','export-followup','backup','snapshot','new-visit','entry-home','agenda','finalize-visit','reopen-visit','close-modal']);document.querySelectorAll('#app input,#app textarea,#app select,#app button').forEach(el=>{if(el.tagName!=='BUTTON'||!allowed.has(el.dataset.act))el.disabled=true;});}
async function finalizeVisit(){if(finalized(state.visit)){await exportFollowup();return;}while(pendingPhotos.size)await Promise.all([...pendingPhotos]);const errors=visitErrors(state);const missing=checksWithoutTask(state);if(errors.length||missing.length){state.tab=4;render();showModal(modalHead(i18n('Falta completar la visita'))+html`<div class="stack">${errors.map(error=>html`<p class="notice warning">${esc(error)}</p>`).join('')}${missing.length?html`<p>Creá o vinculá una tarea para cada incumplimiento antes de finalizar.</p><ul>${missing.map(q=>html`<li><button type="button" class="warning-link" data-act="jump-check" data-id="${q.id}">${esc(q.id)} · ${esc(q.title)}</button></li>`).join('')}</ul>`:''}</div>`);return;}const warnings=visitWarnings(state);if(warnings.length&&!confirm(i18n('La visita tiene estas aclaraciones:')+'\n\n'+warnings.join('\n')+'\n\n'+i18n('¿Finalizar conservando estas aclaraciones?')))return;stopVoice();state.scan=null;state.visit.workflowVersion=1;state.visit.completion={id:id(),at:stamp()};archiveVisit(state);dirty(0);render();await exportFollowup();notify(i18n('Visita finalizada. Compartí el resultado JSON con supervisión.'));}
function reopenVisit(){if(!finalized(state.visit))return;if(!confirm(i18n('¿Reabrir la visita para corregirla? Deberás finalizarla de nuevo y compartir el nuevo resultado con supervisión.')))return;state.visit.completionHistory??=[];state.visit.completionHistory.push(clone(state.visit.completion));state.visit.completion=null;state.visit.workflowVersion=1;archiveVisit(state);dirty(0);render();}
function finalizedActionAllowed(act){return !finalized(state.visit)||['tab','prev','next','pdf','pdf-confirmed','excel-visit','export-followup','backup','snapshot','new-visit','begin-new','entry-home','agenda','load-agenda','start-plan','open-history','reopen-visit','finalize-visit','close-modal','language','help','restore','entry-import','import','resolve-import','resume-draft','export-agenda'].includes(act);}
async function openHistoryVisit(visitId){if(state.editTask)throw Error(i18n('Guardá o descartá la tarea en edición primero.'));const v=state.visit.id===visitId?clone(state.visit):clone(state.visits.find(v=>v.id===visitId)||null);if(!v)throw Error(i18n('El reporte no está en este navegador. Cargá su respaldo o seguimiento para consultarlo.'));while(pendingPhotos.size)await Promise.all([...pendingPhotos]);if(state.visit.centerCode)archiveVisit(state);state.visit=v;state.tab=4;state.entryScreen=false;closeModal();dirty(0);render();}

function validateAcknowledgements(f){if(!f||f.acknowledgements===undefined)return [];if(!Array.isArray(f.acknowledgements)||f.acknowledgements.length>2000)throw Error(i18n('Confirmaciones de agenda incompatibles.'));for(const n of f.acknowledgements)if(!safeId(n.planId)||!Number.isInteger(n.planRevision)||n.planRevision<1||!['received','incomplete','cancelled','reassigned'].includes(n.status)||n.resultId!==null&&!safeId(n.resultId)||!Number.isFinite(Date.parse(n.generatedAt))||n.plan&&(!safeId(n.plan.id)||n.plan.id!==n.planId||n.plan.revision!==n.planRevision||!Object.hasOwn(TYPES,n.plan.type)||typeof n.plan.centerCode!=='string'||typeof n.plan.manager!=='string'||typeof n.plan.auditor!=='string'||!Array.isArray(n.plan.lines)||!['scheduled','cancelled'].includes(n.plan.status)||n.plan.auditorId!==f.auditorId||typeof n.plan.centerName!=='string'||typeof n.plan.objective!=='string'||!isDate(n.plan.date)))throw Error(i18n('Confirmaciones de agenda incompatibles.'));return f.acknowledgements;}

function agendaCard(item){const p=item.plan,v=agendaVisit(item),received=receivedNotice(item,v),disabled=['cancelled','reassigned'].includes(item.notice?.status)||p.status==='cancelled';let status=disabled?(item.notice?.status==='reassigned'?i18n('Reasignada'):i18n('Cancelada')):received?i18n('Resultado recibido por supervisión'):v?.completion?i18n('Finalizada · pendiente de compartir o confirmar'):v?i18n('En curso'):i18n('Pendiente');return html`<section class="inset stack"><div class="row between"><b>${esc(dateLabel(p.date))} · ${esc(p.centerName)}</b><span class="badge">${esc(status)}</span></div><p>${esc(p.auditor)} · ${esc(TYPES[p.type]?.label||p.type)}</p><p>${esc(p.objective)}</p>${item.notice?.status==='incomplete'&&!v?.completion?html`<p class="notice warning">Supervisión recibió un avance. La visita sigue pendiente de finalizar.</p>`:''}${disabled?html`<p class="muted">Conservada como antecedente. No está disponible para comenzar.</p>`:archivedAgenda(item)?(v?html`<button type="button" class="full quiet" data-act="open-history" data-id="${p.id}">Consultar visita / resultado</button>`:html`<p class="muted">Confirmación recibida. El reporte completo no está guardado en este navegador.</p>`):html`<button type="button" class="full primary" data-act="start-plan" data-id="${p.id}">${v?i18n('Retomar esta visita'):i18n('Comenzar esta visita')}</button>`}</section>`;}
function agendaView(){const rows=[...(state.agenda||[])].sort((a,b)=>a.plan.date.localeCompare(b.plan.date)),pending=rows.filter(i=>!archivedAgenda(i)),history=rows.filter(archivedAgenda);const spontaneous=[...state.visits.filter(v=>v.completion&&!rows.some(i=>i.plan.id===v.id))];if(state.visit.completion&&!rows.some(i=>i.plan.id===state.visit.id)&&!spontaneous.some(v=>v.id===state.visit.id))spontaneous.push(state.visit);showModal(modalHead(i18n('Mi agenda'))+html`<div class="stack"><button type="button" class="full" data-act="load-agenda">Cargar / actualizar agenda (.json)</button><h3>Pendientes y en curso · ${pending.length}</h3>${pending.map(agendaCard).join('')||html`<p class="muted">No hay visitas pendientes en esta agenda.</p>`}<details><summary>Historial · ${history.length+spontaneous.length}</summary><div class="stack">${history.map(agendaCard).join('')}${spontaneous.map(v=>html`<section class="inset stack"><b>${esc(v.centerName)} · ${esc(dateLabel(v.date))}</b><p>${esc(visitReceiptLabel(v))}</p><button type="button" class="full quiet" data-act="open-history" data-id="${v.id}">Consultar visita / resultado</button></section>`).join('')||html`<p class="muted">Todavía no hay visitas archivadas.</p>`}</div></details><p class="muted">La recepción por supervisión se confirma cuando importás una agenda actualizada. Las visitas y sus evidencias se conservan.</p></div>`);}

function hasDraft(){const v=state.visit;return !!(v.centerCode||v.auditor||v.objective||v.order||Object.keys(v.checks).length||state.media.some(m=>m.visitId===v.id));}

function showEmissionWarnings(){showModal(modalHead(i18n('Antes de emitir'))+html`<div class="stack"><p>Revisá las advertencias. Tocá un incumplimiento para ir al punto y acordar su tarea.</p><div class="notice warning"><ul>${emissionWarningItems(state)}</ul></div><div class="actions"><button type="button" class="quiet" data-act="close-modal">Volver al informe</button><button type="button" class="primary" data-act="pdf-confirmed">Generar con estas aclaraciones</button></div></div>`);}

function renderData(){const v=state.visit;const lines=selectedLines(v);return heading(i18n('Datos de la visita'),i18n('Auditor, centro de servicio y actividades que vas a realizar.'))+html`<section class="card stack"><h3>Datos del auditor</h3><div class="grid">${auditorFields(v)}</div><p class="muted">Estos datos se conservan para las próximas visitas en este navegador.</p></section><section class="card stack"><h3>Datos del centro de servicio</h3>${!v.centerLocked?html`<div><label for="center-search">Buscar por código o nombre</label><input id="center-search" type="search" autocomplete="off" placeholder="Escribí código ASC o nombre del centro"><div id="center-results" class="stack" style="margin-top:10px"></div><p class="muted" style="margin-top:8px">Base incorporada: 279 combinaciones de código y nombre. Los nombres alternativos de un mismo código se muestran por separado.</p></div>`:''}<div class="grid">${inputField('visit.centerCode',i18n('Código ASC / Ship to'),{upper:true,disabled:v.centerLocked,scan:!v.centerLocked})}${inputField('visit.centerName',i18n('Nombre del centro'))}${inputField('visit.manager',i18n('Responsable del centro'))}${inputField('visit.date',i18n('Fecha de visita'),{type:'date'})}</div><p class="muted">Podés seleccionar de la base o completar los datos manualmente. El código vincula el historial; el nombre elegido queda registrado en cada informe.</p>${v.centerLocked?trMarkup('<p class="muted">Para trabajar con otro centro, iniciá una nueva visita.</p>'):''}</section><section class="card stack"><h3>Tipo y objetivo de la visita</h3><div class="visit-types">${Object.entries(TYPES).map(([k,x])=>html`<button type="button" class="visit-type ${v.type===k?'selected':''}" data-act="type" data-value="${k}" aria-pressed="${v.type===k}"><b>${esc(x.label)}</b><span>${esc(x.description)}</span></button>`).join('')}</div>${inputField('visit.objective',i18n('Objetivo de la visita'),{area:true,voice:true})}<div class="actions">${OBJECTIVES[v.type].map((x,i)=>html`<button type="button" class="small quiet" data-act="objective" data-value="${i}">${esc(x)}</button>`).join('')}</div><p class="muted">Actividades complementarias que surjan durante esta visita:</p><div class="stack">${v.type!=='ride'?html`<label class="switchlabel"><input type="checkbox" data-bind="visit.extras.ride" ${v.extras.ride?'checked':''}>Visita en domicilio</label>`:''}${v.type!=='support'?html`<label class="switchlabel"><input type="checkbox" data-bind="visit.extras.support" ${v.extras.support?'checked':''}>Soporte técnico</label>`:''}${v.type!=='training'?html`<label class="switchlabel"><input type="checkbox" data-bind="visit.extras.training" ${v.extras.training?'checked':''}>Capacitación</label>`:''}</div>${inputField('visit.technician',i18n('Técnico acompañado / participantes'),{voice:true})}</section><section class="card stack"><h3>Equipo o caso de referencia</h3><p class="muted">En la visita al centro podés revisar varias líneas. En un domicilio o caso de soporte, elegí la línea del equipo.</p>${v.type==='workshop'?html`<div class="product-lines">${PRODUCTS.map(p=>html`<label class="switchlabel"><input type="checkbox" data-product="${p[0]}" ${lines.includes(p[0])?'checked':''}>${esc(productLabel(p[0]))}</label>`).join('')}</div>`:selectField('visit.line',i18n('Línea de producto'),[['',i18n('Seleccionar línea…')],...PRODUCTS.map(p=>[p[0],productLabel(p[0])]),...(v.line==='DA'?[['DA',i18n('DA general (registro anterior)')]]:[])])}${v.extras.ride&&v.type!=='ride'?selectField('visit.homeLine',i18n('Línea del equipo visitado en domicilio'),[['',i18n('Seleccionar línea…')],...PRODUCTS.map(p=>[p[0],productLabel(p[0])])]):''}<div class="grid">${inputField('visit.order',i18n('Orden de servicio'),{scan:true})}${inputField('visit.model',i18n('Modelo'),{upper:true,scan:true})}${inputField('visit.serial',i18n('Número de serie'),{upper:true,scan:true})}</div>${inputField('visit.notes',i18n('Observaciones iniciales'),{area:true,voice:true})}</section><div class="actions"><button type="button" class="quiet" data-act="agenda">Mi agenda</button><button type="button" class="quiet" data-act="entry-home">Volver al inicio</button></div>`;}
function renderReview(){const v=state.visit,qs=checksFor(v);const inactive=Object.entries(v.checks).filter(([k,a])=>a.status&&!qs.some(q=>q.id===k)).length;let out=heading(i18n('Revisión técnica'),i18n('Los puntos siguen el recorrido del trabajo. Herramientas y preparación primero; control de calidad después de intervenir.'));out+=html`<section class="card stack"><h3>Alcance de la revisión</h3><p>${esc(lineSummary(v))}</p>${v.extras.ride&&v.type!=='ride'?html`<p class="muted">Visita en domicilio complementaria: ${esc(productLabel(v.homeLine)||i18n('Sin línea seleccionada'))}</p>`:''}<p class="muted">Disponibilidad, condición de uso y utilización de herramientas se revisan en etapas distintas. No se fijan presiones, tiempos ni productos universales: se verifica el procedimiento aplicable al caso.</p>${v.type==='workshop'?inputField('visit.sample',i18n('Órdenes y equipos tomados como muestra'),{area:true,voice:true}):''}${inactive?html`<p class="notice warning">${inactive} respuesta(s) de líneas o actividades deseleccionadas se conservan en el borrador, pero no se incluyen en el checklist del informe actual.</p>`:''}</section>`;
 let group='';for(const q of qs){if(q.section!==group){group=q.section;out+=html`<h3 style="margin:24px 2px 12px">${esc(group)}</h3>`;}const a=v.checks[q.id]||{},linked=taskForPoint(state,q.id);out+=html`<section class="card check-card" id="check-${q.id}" tabindex="-1" aria-labelledby="check-title-${q.id}"><p class="check-code">${q.id}</p><h3 id="check-title-${q.id}">${esc(q.title)}</h3><div class="statusgrid">${Object.entries(ANSWERS).map(([k,name])=>html`<button type="button" data-act="answer" data-id="${q.id}" data-value="${k}" data-selected="${a.status===k}" aria-pressed="${a.status===k}">${esc(name)}</button>`).join('')}</div>${a.status?html`<div class="stack">${inputField('visit.checks.'+q.id+'.note',a.status==='fail'?i18n('Hallazgo observado'):a.status==='na'||a.status==='unverified'?i18n('Motivo / observación'):i18n('Observación / medición'),{area:true,voice:true})}${['na','unverified'].includes(a.status)?html`<div class="actions">${[i18n('No corresponde a la intervención'),i18n('Sin caso disponible para observar'),i18n('No se pudo verificar durante la visita')].map((x,i)=>html`<button type="button" class="small quiet" data-act="reason" data-id="${q.id}" data-value="${i}">${esc(i18n(x))}</button>`).join('')}</div>`:''}${attachmentButtons('check:'+q.id)}${photoTiles(photosFor('check:'+q.id))}${a.status==='fail'||linked?html`<button type="button" class="full ${linked?'quiet':'primary'}" data-act="task-from-check" data-id="${q.id}">${linked?i18n('Ver tarea vinculada')+' · '+esc(TASK_STATUS[linked.status]):i18n('Crear acción para este hallazgo')}</button>`:''}</div>`:''}</section>`;}
 const retired=retiredRows(v);if(retired.length)out+=html`<section class="card"><details><summary>Controles genéricos de versiones anteriores</summary><div>${retired.map(q=>html`<div class="log"><b>${esc(q.title)}</b><p>${esc(ANSWERS[q.status])} · ${esc(q.note||'')}</p>${photoTiles(photosFor('check:'+q.id),false)}</div>`).join('')}</div></details><p class="muted">Estos registros se conservan para consulta. Los nuevos controles se responden por separado.</p></section>`;
 const old=legacyRows(v);if(old.length)out+=html`<section class="card"><details><summary>Revisión anterior conservada (v1)</summary><div>${old.map(q=>html`<div class="log"><b>${esc(q.title)}</b><p>${esc(ANSWERS[q.status])} · ${esc(q.note||'')}</p></div>`).join('')}</div></details><p class="muted">Las respuestas de la versión anterior se conservan para consulta. El nuevo checklist se responde por separado.</p></section>`;
 if(hasSupport(v))out+=html`<section class="card stack"><h3>Soporte técnico del caso</h3><p class="muted">${esc(v.order||i18n('Sin orden'))} · ${esc(v.model||i18n('Modelo pendiente'))} · ${esc(v.serial||i18n('Serie pendiente'))}</p>${inputField('visit.support.symptom',i18n('Síntoma y antecedentes'),{area:true,voice:true})}${inputField('visit.support.tests',i18n('Pruebas y mediciones realizadas'),{area:true,voice:true})}${inputField('visit.support.diagnosis',i18n('Diagnóstico y asistencia brindada'),{area:true,voice:true})}${selectField('visit.support.result',i18n('Resultado'),[['',i18n('Seleccionar…')],['resolved',i18n('Resuelto y verificado')],['partial',i18n('Avance parcial')],['pending',i18n('Pendiente de pruebas / repuestos')],['escalated',i18n('Escalado a soporte')]])}${inputField('visit.support.next',i18n('Próximos pasos / referencia de escalamiento'),{area:true,voice:true})}${attachmentButtons('support')}${photoTiles(photosFor('support'))}<button type="button" class="quiet full" data-act="support-task">Crear un compromiso de soporte</button></section>`;
 if(hasTraining(v))out+=html`<section class="card stack"><h3>Capacitación realizada</h3><div class="grid">${inputField('visit.training.topic',i18n('Tema de capacitación'),{voice:true,wide:true})}${inputField('visit.training.duration',i18n('Duración (minutos)'),{type:'number'})}${selectField('visit.training.result',i18n('Resultado de la práctica'),[['',i18n('Sin evaluación registrada')],['demonstrated',i18n('Comprensión demostrada')],['reinforce',i18n('Requiere refuerzo')],['scheduled',i18n('Práctica pendiente')]])}</div>${inputField('visit.training.attendees',i18n('Asistentes (uno por línea)'),{area:true,voice:true})}${inputField('visit.training.content',i18n('Contenido y material utilizado'),{area:true,voice:true})}${inputField('visit.training.assessment',i18n('Práctica, evaluación y necesidades detectadas'),{area:true,voice:true})}${attachmentButtons('training')}${photoTiles(photosFor('training'))}<button type="button" class="quiet full" data-act="training-task">Crear un compromiso de capacitación</button></section>`;return out;}
function centerOptions(){const map=new Map();for(const c of [...CENTER_BASE,...state.centers])map.set(c.code+'\u0000'+c.name,c);return [...map.values()];}
function filterCenters(query){const target=$('center-results');if(!target)return;if(query===undefined&&state.visit.centerCode.trim()&&state.visit.centerName.trim()){target.innerHTML='';target.hidden=true;return;}target.hidden=false;const q=(query||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const candidates=centerOptions().filter(c=>(c.code+' '+c.name).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q));target.innerHTML=candidates.slice(0,query?20:6).map(c=>html`<button type="button" class="quiet full center-option" data-act="choose-center" data-key="${esc(encodeURIComponent(c.code+'\u0000'+c.name))}"><span><b>${esc(c.name)}</b><br><span class="muted">${esc(c.code)}</span></span></button>`).join('')+(candidates.length>20?html`<p class="muted">${candidates.length} coincidencias. Escribí más caracteres para filtrar.</p>`:'')+(!candidates.length?trMarkup('<p class="muted">No hay coincidencias. Podés completar el centro manualmente.</p>'):'');}
function render(){refreshLanguage();$('tabs').innerHTML=SECTIONS.map((name,i)=>html`<button type="button" data-act="tab" data-tab="${i}" class="${state.tab===i?'active':''}" ${state.tab===i?'aria-current="step"':''}><span>${i+1}</span>${esc(name)}</button>`).join('');document.querySelector('nav.tabs').hidden=!!state.entryScreen;document.querySelector('.bottomnav').hidden=!!state.entryScreen;$('next-button').textContent=state.tab===4?i18n('Descargar PDF'):i18n('Continuar');$('app').innerHTML=state.entryScreen?entryView():[renderData,renderReview,renderEvidence,renderTasks,renderReport][state.tab]();if(state.editTask&&!state.entryScreen&&$('modal').hidden)$('app').insertAdjacentHTML('afterbegin',html`<div class="notice warning">Hay una tarea en edición. <button type="button" class="small quiet" data-act="resume-task">Retomar edición</button></div>`);if(!state.entryScreen&&state.tab===0)filterCenters();if(!state.entryScreen&&finalized(state.visit))$('app').insertAdjacentHTML('afterbegin',lifecycleBanner());protectFinalizedUI();}
function validBind(path){return /^visit\.(auditor|auditorId|centerName|centerCode|manager|date|technician|objective|line|homeLine|order|model|serial|notes|sample|conclusion)$/.test(path)||/^visit\.extras\.(ride|support|training)$/.test(path)||/^visit\.support\.(symptom|tests|diagnosis|result|next)$/.test(path)||/^visit\.training\.(topic|duration|attendees|content|assessment|result)$/.test(path)||/^visit\.checks\.[A-Za-z0-9_-]+\.note$/.test(path)||/^editTask\.(title|action|owner|due|status|note|verification)$/.test(path);}
function help(){showModal(modalHead(i18n('Guía rápida'))+html`<div class="stack"><p>1. Elegí Nueva visita, Continuar seguimiento o Retomar borrador.</p><p>2. Completá auditor e ID; seleccioná el centro por código o nombre, o ingresalo manualmente.</p><p>3. Elegí el tipo, el objetivo y las actividades complementarias. Seleccioná las líneas de producto para adaptar el checklist.</p><p>4. Registrá respuestas, observaciones y fotos. Creá o actualizá tareas con responsable y compromiso.</p><p>5. Revisá el informe, registrá las firmas y descargá el PDF y el JSON actualizado.</p><p class="notice">El PDF comunica la visita. El JSON conserva el historial de tareas y permite continuarlo en otra visita. El Excel registra una fila por visita para consolidar una base. No hay sincronización automática.</p><p>Guardá estos archivos en la carpeta compartida del centro. La app no los sube a una carpeta ni a GitHub automáticamente.</p><p>El idioma cambia la interfaz y los textos del reporte. Los nombres, observaciones y textos dictados conservan el idioma en que se ingresaron.</p><p>En Android usá Chrome y un enlace HTTPS para cámara, dictado y Binary Eye. El dictado usa el idioma seleccionado.</p><a class="button full" href="https://play.google.com/store/apps/details?id=de.markusfisch.android.binaryeye" target="_blank" rel="noopener">Instalar Binary Eye</a></div>`);}

let importMode='current';
function setLanguage(lang){currentLanguage=lang==='en'?'en':'es';state.language=currentLanguage;refreshLanguage();render();dirty();}
function visitErrors(s){const out=visitErrorsV1(s),v=s.visit;if(v.type!=='training'&&!selectedLines(v).some(x=>PRODUCTS.some(p=>p[0]===x)))out.push(i18n('Seleccioná la línea de producto que vas a revisar.'));if(v.extras.ride&&v.type!=='ride'){if(!PRODUCTS.some(p=>p[0]===v.homeLine))out.push(i18n('Seleccioná la línea del equipo visitado en domicilio.'));if(!v.technician.trim()||!v.order.trim())out.push(i18n('Identificá al técnico y la orden de la visita en domicilio.'));}for(const q of checksFor(v)){const a=v.checks[q.id];if(['na','unverified'].includes(a?.status)&&!a.note.trim())out.push(q.id+': '+i18n('Indicá el motivo de No aplica o No verificado.'));}return out;}
async function newVisit(){if(state.editTask)throw new Error(i18n('Guardá o descartá la tarea en edición primero.'));if(hasDraft()&&!confirm(i18n('¿Iniciar una nueva visita? Conservaremos el historial de tareas y visitas. Descargá antes el PDF y el seguimiento que quieras entregar.')))return;while(pendingPhotos.size)await Promise.all([...pendingPhotos]);if(state.visit.centerCode)archiveVisit(state);const profile={auditor:state.visit.auditor,auditorId:state.visit.auditorId,customAuditor:!!state.visit.customAuditor};state.visit={...freshVisit(),...profile};state.entryScreen=false;state.tab=0;state.scan=null;state.lastImport=null;closeModal();dirty(0);render();window.scrollTo(0,0);}
async function importFollowup(files){if(!files.length)return;if(state.editTask)throw new Error(i18n('Guardá o descartá la tarea en edición antes de importar.'));const data=[];for(const f of files)data.push(await readJSON(f));const next=clone(state);if(importMode==='new'){if(hasDraft()&&!confirm(i18n('Se preparará una nueva visita y se conservará el borrador actual en el historial del navegador. ¿Continuar?')))return;if(next.visit.centerCode)archiveVisit(next);const profile={auditor:next.visit.auditor,auditorId:next.visit.auditorId,customAuditor:!!next.visit.customAuditor};next.visit={...freshVisit(),...profile};next.tab=0;next.scan=null;}next.entryScreen=false;const candidate=mergeFollowups(next,data);candidate.base=next;candidate.exports=data.map(f=>f.exportedAt).filter(x=>typeof x==='string'&&Number.isFinite(Date.parse(x)));mergeCandidate=candidate;importNames=files.map(f=>f.name);if(candidate.conflicts.length){showModal(modalHead(i18n('Revisar cambios simultáneos'))+html`<div class="stack"><p class="notice warning">Elegí qué versión queda vigente. Todas las alternativas se conservarán en el historial.</p>${candidate.conflicts.map(c=>html`<section class="inset stack"><h3>${esc(c.options[0].snapshot.title)}</h3>${c.options.map(e=>html`<label class="switchlabel"><input type="radio" name="conflict-${c.taskId}" value="${e.id}"><span><b>${esc(TASK_STATUS[e.snapshot.status])}</b> · ${esc(e.author)}<br>${esc(e.snapshot.action)}<br><span class="muted">${esc(e.snapshot.owner)} · ${esc(dateLabel(e.snapshot.due))} · ${esc(new Date(e.at).toLocaleString(currentLanguage==='en'?'en-US':'es-AR'))}</span><br>${esc(e.snapshot.note||'')}</span></label>`).join('')}</section>`).join('')}<button type="button" class="primary full" data-act="resolve-import">Confirmar versiones</button></div>`);}else await commitImport({});}
async function commitImport(choices){if(!mergeCandidate)return;const c=mergeCandidate,next=c.base;const events=resolveMerge(c,choices,next.visit);const n=events.length-next.events.length;next.events=events;next.media=c.media;next.visits=c.visits;next.centers=c.centers;if(!next.visit.centerCode){next.visit.centerCode=c.center.code;next.visit.centerName=c.center.name;next.visit.manager=c.center.manager;}next.visit.centerLocked=true;next.entryScreen=false;next.language=currentLanguage;next.lastImport={names:importNames,at:stamp(),exports:c.exports};state=next;mergeCandidate=null;importMode='current';closeModal();dirty(0);render();notify(i18n('Seguimiento importado: ')+Math.max(0,n)+i18n(' actualización(es) nueva(s), sin duplicar IDs.'));}
async function handleAction(button){const act=button.dataset.act;if(!finalizedActionAllowed(act)){notify(i18n('Reabrí la visita para modificar sus datos.'));return;}switch(act){case 'finalize-visit':await finalizeVisit();return;case 'reopen-visit':reopenVisit();return;case 'open-history':await openHistoryVisit(button.dataset.id);return;case 'agenda':agendaView();return;case 'load-agenda':$('import-agenda').click();return;case 'start-plan':await startPlannedVisit(button.dataset.id);return;case 'jump-check':jumpToCheck(button.dataset.id);return;case 'pdf-confirmed':closeModal();await exportPDF(true);return;case 'language':setLanguage(currentLanguage==='es'?'en':'es');return;case 'entry-home':state.entryScreen=true;closeModal();render();dirty();return;case 'resume-draft':state.visit.workflowVersion??=1;state.entryScreen=false;render();if(state.editTask)taskEditor();return;case 'begin-new':await newVisit();return;case 'entry-import':importMode='new';$('import-followup').click();return;case 'import':importMode='current';$('import-followup').click();return;case 'choose-center':{if(state.visit.centerLocked)return;const decoded=decodeURIComponent(button.dataset.key),c=centerOptions().find(c=>c.code+'\u0000'+c.name===decoded);if(!c)return;Object.assign(state.visit,{centerCode:c.code,centerName:c.name,manager:c.manager||''});dirty();render();return;}case 'reason':{const q=button.dataset.id;if(!state.visit.checks[q])return;state.visit.checks[q].note=i18n([i18n('No corresponde a la intervención'),i18n('Sin caso disponible para observar'),i18n('No se pudo verificar durante la visita')][Number(button.dataset.value)]);dirty();render();return;}default:return handleActionV1(button);}}
function addV2Events(){$('import-agenda').addEventListener('change',async e=>{try{await importAgenda(e.target.files);}catch(error){notify(error.message);}finally{e.target.value='';}});document.addEventListener('input',e=>{if(e.target.id==='center-search')filterCenters(e.target.value);});document.addEventListener('change',e=>{const el=e.target;if(finalized(state.visit))return;if(el.id==='auditor-select'){selectAuditor(el.value);return;}if(el.dataset.product){const code=el.dataset.product;if(!PRODUCTS.some(p=>p[0]===code))return;const set=new Set(selectedLines(state.visit));if(el.checked)set.add(code);else set.delete(code);state.visit.lines=[...set];state.visit.line=state.visit.lines[0]||'';dirty();render();notify(i18n('Se conserva lo ya registrado; el checklist se adapta a las líneas seleccionadas.'));}if(el.dataset.bind==='visit.line'){state.visit.lines=el.value?[el.value]:[];dirty();render();notify(i18n('Se conserva lo ya registrado; el checklist se adapta a las líneas seleccionadas.'));}if(el.dataset.bind==='visit.homeLine'){dirty();render();}});}

if(!window.__VT_TEST__)boot();

</script></body></html>
